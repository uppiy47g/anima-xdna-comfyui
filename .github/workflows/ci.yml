name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU dependencies and package
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[dev]"
      - name: Run CPU, schema and public release tests
        run: python -m unittest discover -s tests -v
      - name: Check imports and CLIs
        run: |
          python -m compileall -q anima_xdna_poc comfyui_xdna_nodes
          anima-xdna-linear --help
          anima-xdna-block --help
          anima-xdna-chain --help
          anima-xdna-cache --help
      - name: Build distributions
        run: python -m build
